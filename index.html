<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026W杯 webCVアップロード</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg-0: #04100a;
        --surface: rgba(16, 33, 25, 0.55);
        --surface-hi: rgba(24, 48, 36, 0.72);
        --border: rgba(120, 255, 180, 0.12);
        --border-hi: rgba(120, 255, 180, 0.32);
        /* ピッチの緑を基調にしたアクセント群（変数名は互換のため流用） */
        --cyan: #2ee07a;      /* メインの緑 */
        --blue: #16a34a;      /* 深い緑 */
        --purple: #f5b301;    /* 大会アクセント（ゴールド） */
        --text: #e9f5ee;
        --text-dim: #9bb3a4;
        --text-faint: #6b8576;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        font-family: var(--sans);
        color: var(--text);
        line-height: 1.8;
        font-weight: 500;
        background: var(--bg-0);
        position: relative;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* 背景の環境光グロー */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 70% 50% at 15% 0%, rgba(46, 224, 122, 0.18), transparent 60%),
            radial-gradient(ellipse 60% 60% at 100% 100%, rgba(22, 163, 74, 0.16), transparent 60%),
            radial-gradient(ellipse 50% 80% at 50% 50%, rgba(245, 179, 1, 0.07), transparent 70%);
        pointer-events: none;
        z-index: 0;
    }

    /* グリッドテクスチャ（周辺にフェード） */
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(rgba(120, 255, 180, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(120, 255, 180, 0.04) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 25%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 25%, transparent 80%);
        pointer-events: none;
        z-index: 0;
    }

    main {
        max-width: 780px;
        margin: 0 auto;
        padding: 64px 24px 96px;
        position: relative;
        z-index: 1;
    }

    /* 上部クロームバー（パンくず風） */
    .chrome {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-faint);
        letter-spacing: 0.08em;
        margin-bottom: 36px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
    }

    .chrome-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(46, 224, 122, 0.4);
        animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(0.92); }
    }

    .chrome-path { color: var(--text-dim); }
    .chrome-path .sep { color: var(--text-faint); margin: 0 7px; }

    /* ヘッダー */
    .page-header { margin-bottom: 52px; }

    .eyebrow {
        display: inline-block;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.22em;
        color: var(--cyan);
        text-transform: uppercase;
        margin-bottom: 22px;
        padding: 6px 12px;
        border: 1px solid rgba(46, 224, 122, 0.32);
        border-radius: 4px;
        background: rgba(46, 224, 122, 0.06);
        box-shadow: 0 0 24px rgba(46, 224, 122, 0.08);
    }

    h1 {
        font-size: clamp(30px, 4.4vw, 44px);
        font-weight: 900;
        letter-spacing: -0.02em;
        margin: 0;
        line-height: 1.25;
        color: var(--text);
        text-align: center; /* タイトルを中央揃え */
    }

    h1 .accent {
        background: linear-gradient(135deg, #2ee07a 0%, #16a34a 50%, #f5b301 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
    }

    .subtitle {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--text-faint);
        margin-top: 14px;
        letter-spacing: 0.02em;
    }

    /* ステップカード群 */
    .steps { display: flex; flex-direction: column; gap: 14px; }

    .step {
        display: flex;
        gap: 22px;
        padding: 22px 26px;
        background: var(--surface);
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        border: 1px solid var(--border);
        border-radius: 14px;
        transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
        position: relative;
    }

    .step:hover {
        border-color: var(--border-hi);
        background: var(--surface-hi);
        transform: translateY(-1px);
    }

    .step-num {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(46, 224, 122, 0.18) 0%, rgba(22, 163, 74, 0.18) 100%);
        border: 1px solid rgba(46, 224, 122, 0.42);
        color: var(--cyan);
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 3px rgba(46, 224, 122, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        letter-spacing: 0;
    }

    /* 「01」「02」表記用のゼロ */
    .step-num::before {
        content: '0';
        opacity: 0.55;
    }

    .step-body { flex: 1; padding-top: 7px; }
    .step-body p { margin: 0; color: var(--text); }
    .step-body strong { color: var(--cyan); font-weight: 700; }

    kbd {
        display: inline-block;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        background: rgba(120, 255, 180, 0.08);
        border: 1px solid var(--border-hi);
        border-bottom: 2px solid var(--border-hi);
        border-radius: 5px;
        color: var(--text);
        margin: 0 1px;
        line-height: 1.4;
        vertical-align: baseline;
    }

    /* ブックマークレット ドロップゾーン */
    .drop-zone {
        margin: 22px 0;
        padding: 38px 28px;
        text-align: center;
        background:
            radial-gradient(ellipse 60% 100% at 50% 50%, rgba(46, 224, 122, 0.14), transparent 70%),
            linear-gradient(180deg, rgba(16, 33, 25, 0.4), rgba(16, 33, 25, 0.7));
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px dashed rgba(46, 224, 122, 0.38);
        border-radius: 16px;
        position: relative;
        overflow: hidden;
    }

    .drop-zone::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(46, 224, 122, 0.6), transparent);
    }

    .drop-zone-tag {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.32em;
        color: var(--text-faint);
        margin-bottom: 22px;
        text-transform: uppercase;
    }

    .drop-zone-tag::before,
    .drop-zone-tag::after {
        content: '';
        flex: 1;
        max-width: 56px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
    }

    .bookmarklet-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 15px 30px;
        font-family: var(--sans);
        font-size: 16px;
        font-weight: 700;
        color: #04140b;
        text-decoration: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #2ee07a 0%, #16a34a 100%);
        border: 1px solid rgba(46, 224, 122, 0.8);
        box-shadow:
            0 0 28px rgba(46, 224, 122, 0.42),
            0 8px 32px rgba(46, 224, 122, 0.22),
            inset 0 1px 0 rgba(255, 255, 255, 0.4),
            inset 0 -1px 0 rgba(0, 0, 0, 0.08);
        cursor: grab;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        letter-spacing: 0.02em;
        position: relative;
    }

    /* ドラッグハンドル風のドット */
    .bookmarklet-link::before {
        content: '';
        width: 8px;
        height: 12px;
        background-image:
            radial-gradient(circle, currentColor 1.2px, transparent 1.5px),
            radial-gradient(circle, currentColor 1.2px, transparent 1.5px);
        background-size: 4px 4px;
        background-position: 0 0, 4px 0;
        background-repeat: repeat-y;
        opacity: 0.5;
    }

    .bookmarklet-link:hover {
        transform: translateY(-3px);
        box-shadow:
            0 0 36px rgba(46, 224, 122, 0.62),
            0 16px 48px rgba(46, 224, 122, 0.32),
            inset 0 1px 0 rgba(255, 255, 255, 0.4),
            inset 0 -1px 0 rgba(0, 0, 0, 0.08);
    }

    .bookmarklet-link:active { cursor: grabbing; transform: translateY(-1px); }

    .version-date {
        display: block;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-faint);
        margin-top: 20px;
        letter-spacing: 0.04em;
    }

    /* ページロード時のステップ順次表示 */
    .chrome, .page-header, .step, .drop-zone {
        opacity: 0;
        animation: reveal 0.6s cubic-bezier(0.2, 0.6, 0.2, 1) forwards;
    }
    .chrome { animation-delay: 0.05s; }
    .page-header { animation-delay: 0.15s; }
    .step:nth-of-type(1) { animation-delay: 0.30s; }
    .step:nth-of-type(2) { animation-delay: 0.40s; }
    .drop-zone { animation-delay: 0.50s; }
    .step:nth-of-type(3) { animation-delay: 0.62s; }

    @keyframes reveal {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
        main { padding: 48px 16px 72px; }
        .step { padding: 20px; gap: 16px; }
        .step-num { width: 38px; height: 38px; font-size: 13px; }
        .drop-zone { padding: 30px 20px; }
        .bookmarklet-link { padding: 14px 24px; font-size: 15px; }
        .chrome { font-size: 10px; }
    }
    </style>
</head>
<body>
    <main>
        <header class="page-header">
            <h1><span class="accent">2026W杯</span> webCVアップロード<br>「ユニ取材」のメタテンプレ</h1>
        </header>

        <div class="steps">
            <section class="step">
                <div class="step-num">1</div>
                <div class="step-body">
                    <p>ブラウザ画面で“ブックマークバー”が表示されていない場合<br>キーボードで <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd> を押してください</p>
                </div>
            </section>

            <section class="step">
                <div class="step-num">2</div>
                <div class="step-body">
                    <p>下の<strong>「webCV_W杯テンプレ」ボタン</strong>を、ブラウザのブックマークバーへ<br>ドラッグ&ドロップして、お気に入り追加してください</p>
                </div>
            </section>

            <div class="drop-zone">
                <div class="drop-zone-tag">Drag to bookmarks bar</div>
                <a href="javascript:(function()%7Bvar%20d%3Ddocument%2Cs%3Dd.createElement('script')%3Bs.src%3D'https%3A%2F%2F2026-w-cup.vercel.app%2Ftool.js%3F_%3D'%2BDate.now()%3Bs.onerror%3Dfunction()%7Balert('%E3%83%84%E3%83%BC%E3%83%AB%E3%81%AE%E8%AA%AD%E3%81%BF%E8%BE%BC%E3%81%BF%E3%81%AB%E5%A4%B1%E6%95%97%E3%81%97%E3%81%BE%E3%81%97%E3%81%9F%E3%80%82%E9%80%9A%E4%BF%A1%E7%8A%B6%E6%B3%81%E3%82%84%E3%83%96%E3%83%AD%E3%83%83%E3%82%AF%E8%A8%AD%E5%AE%9A%E3%82%92%E3%81%94%E7%A2%BA%E8%AA%8D%E3%81%8F%E3%81%A0%E3%81%95%E3%81%84%E3%80%82')%7D%3B(d.head%7C%7Cd.documentElement).appendChild(s)%7D)()" class="bookmarklet-link">webCV_W杯テンプレ</a>
                <span class="version-date">バージョン日付：2026/5/26</span>
            </div>

            <!-- 手順3を追加 -->
            <section class="step">
                <div class="step-num">3</div>
                <div class="step-body">
                    <p>webCVの<strong>元素材登録画面</strong>を開き、お気に入り追加した<strong>「webCV_W杯テンプレ」</strong>を<br>クリックしてください<br><u>※クリックする際はwebCVを開いた状態にしてください</u></p>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
